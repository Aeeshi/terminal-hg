<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezpieczny Terminal Dostępu</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 15, 30, 0.6);
            --border-color: rgba(0, 243, 255, 0.2);
            --primary-glow: #00f3ff;
            --error-glow: #ff0055;
            --success-glow: #00ff66;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a3a 0%, #05050a 100%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Overlay do białego błysku */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease-out;
            z-index: 999;
        }

        .terminal-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 
                        inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 360px;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .terminal-container.slide-down {
            transform: translateY(120vh) rotate(5deg);
            opacity: 0;
            pointer-events: none;
        }

        .terminal-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 26px;
            background: linear-gradient(45deg, var(--primary-glow), transparent, var(--primary-glow));
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
        }

        .terminal-header h2 {
            color: var(--text-color);
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .display-screen {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 60px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Styl suwaka głośności */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: opacity 0.4s ease;
        }

        .volume-control span {
            color: var(--text-color);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-glow);
            cursor: pointer;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.active {
            background: var(--primary-glow);
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: scale(1.2);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .key {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            height: 65px;
            color: var(--text-color);
            font-size: 1.4rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .key:hover {
            background: rgba(0, 243, 255, 0.08);
            border-color: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        .key:active {
            background: rgba(0, 243, 255, 0.2);
            transform: scale(0.92);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .terminal-container.error {
            animation: glitchAnim 0.4s ease-in-out;
            border-color: var(--error-glow);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }

        .terminal-container.error .dot.active {
            background: var(--error-glow);
            border-color: var(--error-glow);
            box-shadow: 0 0 15px var(--error-glow);
        }

        @keyframes glitchAnim {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-8px, 4px); filter: hue-rotate(90deg); }
            40% { transform: translate(8px, -4px); filter: hue-rotate(180deg); }
            60% { transform: translate(-4px, -2px); filter: hue-rotate(270deg); }
            80% { transform: translate(4px, 2px); filter: hue-rotate(45deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        .terminal-container.success {
            border-color: var(--success-glow);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
        }

        .terminal-container.success .dot.active {
            background: var(--success-glow);
            border-color: var(--success-glow);
            box-shadow: 0 0 15px var(--success-glow);
        }

        /* Skaner linii papilarnych */
        .scanner-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .scanner-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .scanner-box {
            width: 160px;
            height: 160px;
            border: 2px solid var(--primary-glow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            transition: all 0.3s ease;
            user-select: none;
            background: rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .scanner-box:hover {
            box-shadow: 0 0 35px var(--primary-glow);
            transform: scale(1.05);
        }

        .fingerprint-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fingerprint-base {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.15);
            transition: fill 0.3s ease;
        }

        .fingerprint-active {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: var(--success-glow);
            filter: drop-shadow(0 0 10px var(--success-glow));
            clip-path: inset(100% 0 0 0);
            transition: clip-path 0.05s linear;
        }

        .scanner-box.scanning .fingerprint-base {
            fill: rgba(255, 255, 255, 0.35);
        }

        .scanner-text {
            color: var(--text-color);
            margin-top: 25px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .result-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .result-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #result-2137 {
            animation: discoBg 4s infinite linear;
        }

        @keyframes discoBg {
            0% { background: radial-gradient(circle, #ff0055 0%, #05050a 100%); }
            25% { background: radial-gradient(circle, #7b00ff 0%, #05050a 100%); }
            50% { background: radial-gradient(circle, #00ffff 0%, #05050a 100%); }
            75% { background: radial-gradient(circle, #00ff66 0%, #05050a 100%); }
            100% { background: radial-gradient(circle, #ff0055 0%, #05050a 100%); }
        }

        .jp2-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: floatUp 1.5s ease-in-out infinite alternate;
        }

        .jp2-img {
            width: 280px;
            height: 350px;
            object-fit: cover;
            border-radius: 16px;
            border: 4px solid #fff;
            animation: discoStrobe 0.6s infinite alternate;
        }

        @keyframes discoStrobe {
            0% { border-color: #ff0055; box-shadow: 0 0 50px #ff0055; filter: hue-rotate(0deg); }
            33% { border-color: #00ff66; box-shadow: 0 0 50px #00ff66; filter: hue-rotate(120deg); }
            66% { border-color: #00f3ff; box-shadow: 0 0 50px #00f3ff; filter: hue-rotate(240deg); }
            100% { border-color: #ffcc00; box-shadow: 0 0 50px #ffcc00; filter: hue-rotate(360deg); }
        }

        .jp2-caption {
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px #ff0055;
            letter-spacing: 2px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }

        .envelope-wrapper {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 180px;
            height: 120px;
            background: #1e1e3f;
            border: 2px solid var(--env-color);
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 25px var(--env-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-top: 65px solid var(--env-top);
            transform-origin: top;
            transition: transform 0.5s ease;
        }

        .envelope-wrapper.open .envelope::before {
            transform: rotateX(180deg);
        }

        .envelope-text {
            color: var(--env-color);
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--env-shadow);
        }

        .message-card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 0 50px var(--card-shadow);
            position: absolute;
            transform: translateY(50px) scale(0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .result-screen.active .message-card.show {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .message-card h1 {
            color: var(--card-border);
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--card-shadow);
        }

        .message-card p {
            color: var(--text-color);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--card-border);
            padding: 12px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s ease;
            position: relative;
            z-index: 101;
        }

        .back-btn:hover {
            background: var(--card-border);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--card-shadow);
        }

        #result-19012002 {
            --env-color: #0b3c5d;
            --env-shadow: rgba(11, 60, 93, 0.6);
            --env-top: rgba(11, 60, 93, 0.7);
            --card-border: #1d6fa5;
            --card-shadow: rgba(29, 111, 165, 0.4);
        }

        #result-30042008 {
            --env-color: #ff758c;
            --env-shadow: rgba(255, 117, 140, 0.6);
            --env-top: rgba(255, 117, 140, 0.7);
            --card-border: #ff758c;
            --card-shadow: rgba(255, 117, 140, 0.4);
        }

        /* Styl dla efektu trzęsienia i serduszka z kawałków */
        .message-card.shake-1 { animation: shakeLevel1 0.3s infinite ease-in-out; }
        .message-card.shake-2 { animation: shakeLevel2 0.2s infinite ease-in-out; }
        .message-card.shake-3 { animation: shakeLevel3 0.1s infinite ease-in-out; }

        @keyframes shakeLevel1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 2px) rotate(-1deg); }
            40% { transform: translate(3px, -2px) rotate(1deg); }
            60% { transform: translate(-2px, -1px) rotate(0deg); }
            80% { transform: translate(2px, 3px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes shakeLevel2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-7px, 5px) rotate(-2deg); }
            40% { transform: translate(7px, -5px) rotate(2deg); }
            60% { transform: translate(-5px, -3px) rotate(-1deg); }
            80% { transform: translate(5px, 6px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes shakeLevel3 {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 10px) rotate(-4deg); }
            40% { transform: translate(12px, -10px) rotate(4deg); }
            60% { transform: translate(-10px, -6px) rotate(-2deg); }
            80% { transform: translate(10px, 12px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .glass-shard {
            position: absolute;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 117, 140, 0.5));
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.6);
            pointer-events: none;
            z-index: 150;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 200;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-container.show {
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .beating-heart {
            font-size: 8rem;
            color: #ff758c;
            filter: drop-shadow(0 0 25px #ff758c);
            user-select: none;
        }

        .heart-container.beat .beating-heart {
            animation: heartBeat 0.8s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .petals-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        .rose-petal {
            position: absolute;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            border-radius: 150% 0% 150% 0%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) translateX(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(50vh) translateX(30px) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(-20px) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--primary-glow);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px var(--primary-glow);
            animation: sparkleFly 0.5s ease-out forwards;
        }

        @keyframes sparkleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>

            <div class="dot" data-index="1"></div>
            <div class="dot" data-index="2"></div>
            <div class="dot" data-index="3"></div>
            <div class="dot" data-index="4" style="display:none;"></div>
            <div class="dot" data-index="5" style="display:none;"></div>
            <div class="dot" data-index="6" style="display:none;"></div>
            <div class="dot" data-index="7" style="display:none;"></div>
        </div>

        <!-- Suwak głośności muzyki -->
        <div class="volume-control" id="volumeControlContainer">
            <span>Głośność:</span>
            <input type="range" min="0" max="1" step="0.05" value="0.3" class="volume-slider" id="volumeSlider">

        <div class="keypad">
            <div class="key" data-value="1">1</div>
            <div class="key" data-value="2">2</div>

            <div class="key" data-value="4">4</div>
            <div class="key" data-value="5">5</div>
            <div class="key" data-value="6">6</div>
            <div class="key" data-value="7">7</div>
            <div class="key" data-value="8">8</div>
            <div class="key" data-value="9">9</div>
            <div class="key" data-value="C" style="color: #ff0055;">C</div>
            <div class="key" data-value="0">0</div>
            <div class="key" data-value="B" style="color: #00f3ff;">←</div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKeySound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let freq = 600;
            let duration = 0.05;
            let wave = 'triangle';

            if (type === 'click') {
                freq = 700;
                wave = 'sine';
            } else if (type === 'delete') {
                freq = 350;
                wave = 'sawtooth';
                duration = 0.08;
            } else if (type === 'error') {
                freq = 150;
                wave = 'sawtooth';
                duration = 0.25;
            } else if (type === 'success') {
                freq = 880;
                wave = 'sine';
                duration = 0.15;
            } else if (type === 'typewriter') {
                freq = Math.random() * 200 + 400;
                wave = 'square';
                duration = 0.025;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.type = wave;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
                return;
            }

            osc.type = wave;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSpecialSound(effectType) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (effectType === 'earthquake') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(40, now);
                osc.frequency.linearRampToValueAtTime(25, now + 5);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(120, now);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 2.5);
                gain.gain.linearRampToValueAtTime(0.01, now + 5);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 5);

            } else if (effectType === 'glass-shatter') {
                // Odtwarzanie fizycznego pliku shatter.mp3 z zachowaniem suwaka głośności
                const shatterAudio = new Audio('shatter.mp3');
                shatterAudio.volume = bgAudio.volume;
                shatterAudio.play().catch(err => {
                    console.log("Błąd odtwarzania shatter.mp3:", err);
                });

            } else if (effectType === 'heartbeat') {
                function singleBeat(time, pitchMod) {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(90 * pitchMod, time);
                    o.frequency.exponentialRampToValueAtTime(35 * pitchMod, time + 0.1);

                    g.gain.setValueAtTime(0.3, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(time);
                    o.stop(time + 0.12);
                }

                singleBeat(now, 1.0);
                singleBeat(now + 0.15, 0.8);
            }
        }

        const bgAudio = new Audio();
        bgAudio.loop = false;
        bgAudio.volume = 0.3;

        const volumeSlider = document.getElementById('volumeSlider');
        volumeSlider.addEventListener('input', (e) => {
            bgAudio.volume = e.target.value;
        });

        let enteredPin = "";
        let pendingTargetId = "";
        let martaTimeout = null;
        let heartbeatInterval = null;
        
        const terminal = document.getElementById('terminal');
        const statusText = document.getElementById('status-text');
        const dots = document.querySelectorAll('.dot');
        const scannerScreen = document.getElementById('scannerScreen');
        const scannerBox = document.getElementById('scannerBox');
        const scannerText = document.getElementById('scannerText');
        const fingerprintActive = document.getElementById('fingerprintActive');
        const volumeControlContainer = document.getElementById('volumeControlContainer');

        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', (e) => {
                createSparkles(e.clientX, e.clientY);
                const val = key.getAttribute('data-value');
                if (terminal.classList.contains('success') || terminal.classList.contains('error') || terminal.classList.contains('slide-down')) return;

                if (val === 'C') {
                    enteredPin = "";
                    playKeySound('delete');
                } else if (val === 'B') {
                    enteredPin = enteredPin.slice(0, -1);
                    playKeySound('delete');
                } else {
                    if (enteredPin.length < 8) {
                        enteredPin += val;
                        playKeySound('click');
                    }
                }

                updateDots();

                if (enteredPin === "2137" || enteredPin.length === 8) {
                    validatePin();
                }
            });
        });

        function createSparkles(x, y) {
            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 20;
                sparkle.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
                sparkle.style.setProperty('--dy', (Math.sin(angle) * distance) + 'px');
                
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 500);
            }
        }

        function updateDots() {
            dots.forEach((dot, idx) => {
                if (idx < enteredPin.length) {
                    dot.style.display = 'inline-block';
                    dot.classList.add('active');
                } else {
                    dot.style.display = (idx < 4 || enteredPin.length > 4) ? 'inline-block' : 'none';
                    dot.classList.remove('active');
                }
            });
        }

        function validatePin() {
            const map = {
                "2137": "result-2137",
                "19012002": "result-19012002",
                "30042008": "result-30042008"
            };

            if (map[enteredPin]) {
                pendingTargetId = map[enteredPin];
                terminal.classList.add('success');
                statusText.innerText = "Dostęp przyznany";
                playKeySound('success');
                
                volumeControlContainer.style.opacity = '0';
                setTimeout(() => { volumeControlContainer.style.display = 'none'; }, 400);

                setTimeout(() => terminal.classList.add('slide-down'), 400);

                setTimeout(() => {
                    if (enteredPin === "2137") {
                        document.getElementById(pendingTargetId).classList.add('active');
                        bgAudio.src = "barka.mp3";
                        bgAudio.play().catch(e => console.log(e));
                    } else {
                        scannerScreen.classList.add('active');
                    }
                }, 1200);

            } else {
                terminal.classList.add('error');
                statusText.innerText = "Błędny PIN";
                playKeySound('error');

                setTimeout(() => {
                    terminal.classList.remove('error');
                    statusText.innerText = "Wprowadź kod PIN";
                    enteredPin = "";
                    updateDots();
                }, 800);
            }
        }

        let scanInterval = null;
        let scanProgress = 0;
        let isScanning = false;

        function startScanning() {
            if (isScanning) return;
            isScanning = true;
            scannerBox.classList.add('scanning');
            scannerText.innerText = "Skanowanie...";
            playKeySound('click');

            let startTime = Date.now();
            const duration = 1500;

            scanInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                scanProgress = Math.min((elapsed / duration) * 100, 100);
                
                let insetTop = 100 - scanProgress;
                fingerprintActive.style.clipPath = `inset(${insetTop}% 0 0 0)`;

                if (scanProgress >= 100) {
                    clearInterval(scanInterval);
                    scannerText.innerText = "Zeskanowano pomyślnie!";
                    playKeySound('success');

                    setTimeout(() => {
                        scannerScreen.classList.remove('active');
                        document.getElementById(pendingTargetId).classList.add('active');
                        scannerText.innerText = "Przytrzymaj, aby zeskanować";
                        fingerprintActive.style.clipPath = 'inset(100% 0 0 0)';
                        isScanning = false;
                    }, 600);
                }
            }, 30);
        }

        function cancelScanning() {
            if (!isScanning) return;
            if (scanProgress < 100) {
                clearInterval(scanInterval);
                scannerBox.classList.remove('scanning');
                scannerText.innerText = "Przytrzymaj, aby zeskanować";
                fingerprintActive.style.clipPath = 'inset(100% 0 0 0)';
                isScanning = false;
            }
        }

        scannerBox.addEventListener('mousedown', startScanning);
        scannerBox.addEventListener('touchstart', (e) => { e.preventDefault(); startScanning(); });
        scannerBox.addEventListener('mouseup', cancelScanning);
        scannerBox.addEventListener('touchend', cancelScanning);
        scannerBox.addEventListener('mouseleave', cancelScanning);

        let petalInterval = null;

        function openEnvelope(dateKey, audioFile) {
            const wrapper = document.getElementById('env-' + dateKey);
            const card = document.getElementById('card-' + dateKey);

            wrapper.classList.add('open');
            
            setTimeout(() => {
                wrapper.style.display = 'none';
                card.classList.add('show');
                
                let msgText = "";
                if (dateKey === '19012002') {
                    msgText = "Mój ulubiony dzień w roku – w końcu to wtedy na świat przyszedłem ja, choć prawdą jest, że najlepsze, co mogło się z tym dniem wydarzyć, to to, że teraz mogę dzielić go z Tobą. Bez Ciebie mój świat straciłby połowę uroku. Dziękuję, że jesteś moim najpiękniejszym powodem do uśmiechu.";
                } else if (dateKey === '30042008') {
                    msgText = "Ta data jest w pełni dedykowana Tobie. Kiedykolwiek przychodzi mi do głowy, jest to najpiękniejsze przypomnienie o tym, jak niezwykle uroczą osobą jesteś – wnosząc tyle ciepła, czułości i blasku w każdy mój dzień. Dziękuję, że po prostu jesteś i że tworzysz ze mną to wszystko, co mamy.";
                    startRosePetals();
                    
                    martaTimeout = setTimeout(() => {
                        card.classList.add('shake-1');
                        playSpecialSound('earthquake');

                        setTimeout(() => {
                            card.classList.remove('shake-1');
                            card.classList.add('shake-2');
                        }, 1500);

                        setTimeout(() => {
                            card.classList.remove('shake-2');
                            card.classList.add('shake-3');
                        }, 3000);

                        setTimeout(() => {
                            card.classList.remove('shake-3');
                            playSpecialSound('glass-shatter');
                            shatterCard(card);
                        }, 5000);

                    }, 30000);
                }

                typeWriterEffect('text-' + dateKey, msgText);
            }, 400);

            bgAudio.src = audioFile;
            bgAudio.play().catch(err => {
                console.error("Błąd odtwarzania:", err);
            });
        }

        function shatterCard(card) {
            const rect = card.getBoundingClientRect();
            const cols = 6;
            const rows = 6;
            const shardWidth = rect.width / cols;
            const shardHeight = rect.height / rows;

            card.style.opacity = '0';
            card.style.pointerEvents = 'none';

            // Uruchomienie białego błysku na 3 sekundy
            const flash = document.getElementById('flash-overlay');
            flash.style.transition = 'none';
            flash.style.opacity = '1';
            void flash.offsetWidth;
            flash.style.transition = 'opacity 3s ease-out';
            flash.style.opacity = '0';

            let shards = [];

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const shard = document.createElement('div');
                    shard.className = 'glass-shard';
                    shard.style.width = shardWidth + 'px';
                    shard.style.height = shardHeight + 'px';
                    
                    const startX = rect.left + c * shardWidth;
                    const startY = rect.top + r * shardHeight;
                    shard.style.left = startX + 'px';
                    shard.style.top = startY + 'px';
                    
                    document.body.appendChild(shard);
                    shards.push(shard);

                    const scatterX = (Math.random() - 0.5) * 300;
                    const scatterY = (Math.random() - 0.5) * 300;

                    setTimeout(() => {
                        shard.style.transform = `translate(${scatterX}px, ${scatterY}px) rotate(${Math.random() * 360}deg) scale(0.6)`;
                        shard.style.opacity = '0.7';
                    }, 50);
                }
            }

            // Układanie odłamków w serduszko po 3 sekundach
            setTimeout(() => {
                shards.forEach((shard, index) => {
                    const t = (index / shards.length) * Math.PI * 2;
                    const hX = 16 * Math.pow(Math.sin(t), 3);
                    const hY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    
                    const targetX = centerX + hX * 10 - shardWidth / 2;
                    const targetY = centerY + hY * 10 - shardHeight / 2;

                    shard.style.transform = `translate(${targetX - parseFloat(shard.style.left)}px, ${targetY - parseFloat(shard.style.top)}px) scale(0.3) rotate(0deg)`;
                    shard.style.opacity = '0.9';
                });
            }, 3000);

            // Po ułożeniu odłamków (kolejne 3s), odczekaj dodatkowe 2 sekundy przed pokazaniem serca
            setTimeout(() => {
                shards.forEach(shard => shard.remove());
                
                setTimeout(() => {
                    const heartContainer = document.getElementById('heartContainer');
                    heartContainer.classList.add('show');
                    
                    setTimeout(() => {
                        heartContainer.classList.add('beat');
                        playSpecialSound('heartbeat');
                        
                        heartbeatInterval = setInterval(() => {
                            playSpecialSound('heartbeat');
                        }, 800);

                    }, 500);

                }, 2000); // Dodatkowe 2 sekundy pauzy

            }, 6000); // 3000ms rozbryzg + 3000ms układanie
        }

        function typeWriterEffect(elementId, text) {
            const el = document.getElementById(elementId);
            el.innerText = "";
            let i = 0;

            function typing() {
                if (i < text.length) {
                    el.innerText += text.charAt(i);
                    playKeySound('typewriter');
                    i++;
                    
                    let randomSpeed = Math.random() * 60 + 15;
                    
                    if (text.charAt(i - 1) === ' ' || text.charAt(i - 1) === '.') {
                        randomSpeed += 40;
                    }

                    setTimeout(typing, randomSpeed);
                }
            }
            typing();
        }

        function startRosePetals() {
            const container = document.getElementById('petals-layer');
            petalInterval = setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('rose-petal');
                
                const size = Math.random() * 12 + 10;
                petal.style.width = size + 'px';
                petal.style.height = (size * 1.4) + 'px';
                petal.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 3 + 3;
                petal.style.animationDuration = duration + 's';
                
                container.appendChild(petal);
                
                setTimeout(() => {
                    petal.remove();
                }, duration * 1000);
            }, 300);
        }

        function resetTerminalState() {
            bgAudio.pause();
            bgAudio.currentTime = 0;

            if (martaTimeout) {
                clearTimeout(martaTimeout);
                martaTimeout = null;
            }

            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }

            if (petalInterval) {
                clearInterval(petalInterval);
                petalInterval = null;
            }
            document.querySelectorAll('.rose-petal').forEach(p => p.remove());
            document.querySelectorAll('.glass-shard').forEach(s => s.remove());

            const heartContainer = document.getElementById('heartContainer');
            if (heartContainer) {
                heartContainer.classList.remove('show', 'beat');
            }

            const card30 = document.getElementById('card-30042008');
            if (card30) {
                card30.classList.remove('shake-1', 'shake-2', 'shake-3');
                card30.style.opacity = '1';
                card30.style.pointerEvents = '';
            }

            document.querySelectorAll('.envelope-wrapper').forEach(w => {
                w.classList.remove('open');
                w.style.display = 'flex';
            });
            document.querySelectorAll('.message-card').forEach(c => c.classList.remove('show'));
            document.querySelectorAll('.result-screen').forEach(s => s.classList.remove('active'));
            scannerScreen.classList.remove('active');
            
            volumeControlContainer.style.display = 'flex';
            setTimeout(() => { volumeControlContainer.style.opacity = '1'; }, 50);

            terminal.classList.remove('slide-down', 'success', 'error');
            statusText.innerText = "Wprowadź kod PIN";
            enteredPin = "";
            updateDots();
        }
    </script>
</body>
