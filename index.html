<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efekty Specjalne</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Overlay do białego błysku */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease-out;
            z-index: 999;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #333;
            border-color: #777;
        }

        button:active {
            transform: scale(0.95);
        }

        #heart-container {
            position: relative;
            width: 200px;
            height: 200px;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #heart-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        .heart {
            position: absolute;
            width: 100px;
            height: 160px;
            background: #ff3366;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
        }

        .heart.left {
            left: 100px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart.right {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="heart-container">
        <div class="heart left"></div>
        <div class="heart right"></div>
    </div>

    <div class="controls">
        <button onclick="triggerEffect('earthquake')">Trzęsienie Ziemi</button>
        <button onclick="triggerEffect('glass-shatter')">Wybuch / Trzask</button>
        <button onclick="triggerEffect('heartbeat')">Bicie Serca</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSpecialSound(effectType) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (effectType === 'earthquake') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(40, now);
                osc.frequency.linearRampToValueAtTime(25, now + 5);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(120, now);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 2.5);
                gain.gain.linearRampToValueAtTime(0.01, now + 5);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 5);

            } else if (effectType === 'glass-shatter') {
                // Kinowy wybuch / głęboki trzask
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(100, now + 1.2);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(now);
                noise.stop(now + 1.4);

                const subOsc = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(120, now);
                subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.8);

                subGain.gain.setValueAtTime(0.5, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                subOsc.connect(subGain);
                subGain.connect(audioCtx.destination);
                subOsc.start(now);
                subOsc.stop(now + 0.8);

            } else if (effectType === 'heartbeat') {
                function singleBeat(time, pitchMod) {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(90 * pitchMod, time);
                    o.frequency.exponentialRampToValueAtTime(35 * pitchMod, time + 0.1);

                    g.gain.setValueAtTime(0.3, time);
                    g.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(time);
                    o.stop(time + 0.12);
                }

                singleBeat(now, 1.0);
                singleBeat(now + 0.15, 0.8);
            }
        }

        function triggerEffect(type) {
            playSpecialSound(type);

            if (type === 'glass-shatter') {
                const flash = document.getElementById('flash-overlay');
                const heartContainer = document.getElementById('heart-container');

                // Schowaj serce, jeśli było widoczne
                heartContainer.classList.remove('visible');

                // Natychmiastowy błysk (100% białego)
                flash.style.transition = 'none';
                flash.style.opacity = '1';

                // Wymuszenie reflow, aby przeglądarka zrozumiała zmianę transition
                void flash.offsetWidth;

                // Powolne gaszenie błysku przez 3 sekundy
                flash.style.transition = 'opacity 3s ease-out';
                flash.style.opacity = '0';

                // Po 3 sekundach (koniec rozjaśniania) odczekaj kolejne 2 sekundy i pokaż serce
                setTimeout(() => {
                    setTimeout(() => {
                        heartContainer.classList.add('visible');
                    }, 2000); // 2 sekundy pauzy po zniknięciu błysku
                }, 3000); // czas trwania błysku
            }
        }
    </script>
</body>
</html>
