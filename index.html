<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezpieczny Terminal Dostępu</title>
    <style>
        /* Stylistyka pozostaje bez zmian, dla spójności */
        :root { --bg-color: #05050a; --panel-bg: rgba(15, 15, 30, 0.6); --border-color: rgba(0, 243, 255, 0.2); --primary-glow: #00f3ff; --text-color: #ffffff; }
        body { background-color: var(--bg-color); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: sans-serif; }
        .terminal-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px; width: 360px; text-align: center; transition: transform 0.8s; }
        .terminal-container.slide-down { transform: translateY(120vh); opacity: 0; }
        .display-screen { background: rgba(0, 0, 0, 0.4); border-radius: 12px; height: 60px; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }
        .dot.active { background: var(--primary-glow); box-shadow: 0 0 15px var(--primary-glow); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .key { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; height: 60px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .result-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; justify-content: center; align-items: center; background: radial-gradient(circle, #2a0845 0%, #05050a 100%); }
        .result-screen.active { display: flex; }
        .jp2-img { width: 280px; height: 350px; object-fit: cover; border-radius: 16px; border: 3px solid #ffcc00; }
        .back-btn { margin-top: 20px; background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 10px 20px; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="terminal-container" id="terminal">
        <h2 style="color:white; margin-bottom:20px;">PIN</h2>
        <div class="display-screen" id="display">
            <div class="dot" data-index="0"></div><div class="dot" data-index="1"></div><div class="dot" data-index="2"></div><div class="dot" data-index="3"></div>
        </div>
        <div class="keypad" id="keypad">
            <!-- Przyciski -->
            <script>
                for(let i=1; i<=9; i++) document.write(`<div class="key" onclick="press(${i})">${i}</div>`);
                document.write(`<div class="key" onclick="resetPin()">C</div><div class="key" onclick="press(0)">0</div><div class="key" onclick="backspace()">←</div>`);
            </script>
        </div>
    </div>

    <div class="result-screen" id="result-2137">
        <div style="text-align:center;">
            <!-- ŁADOWANIE Z TWOJEGO PLIKU -->
            <img class="jp2-img" src="jp2.jpg" alt="JP2">
            <br>
            <button class="back-btn" onclick="location.reload()">ZABLOKUJ</button>
        </div>
    </div>

    <script>
        let pin = "";
        const audio = new Audio('barka.mp3'); // ŁADOWANIE TWOJEGO PLIKU MP3

        function press(num) {
            if(pin.length < 4) {
                pin += num;
                updateDots();
                if(pin.length === 4) checkPin();
            }
        }

        function updateDots() {
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.className = i < pin.length ? 'dot active' : 'dot';
            });
        }

        function checkPin() {
            if(pin === "2137") {
                document.getElementById('terminal').classList.add('slide-down');
                document.getElementById('result-2137').classList.add('active');
                audio.play(); // Odtwarzanie Twojego pliku barka.mp3
            } else {
                alert("BŁĘDNY PIN");
                resetPin();
            }
        }

        function resetPin() { pin = ""; updateDots(); }
        function backspace() { pin = pin.slice(0, -1); updateDots(); }
    </script>
</body>
</html>
